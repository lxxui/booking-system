<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการรายการจอง - Booking App (Admin)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #171512;
      --ink-soft: #57534A;
      --bone: #EFE9DD;
      --paper: #FBF8F2;
      --moss: #4B5D46;
      --moss-dark: #3B4A38;
      --brass: #B9915B;
      --rose: #C97B6C;
    }

    body {
      font-family: 'IBM Plex Sans Thai', sans-serif;
      background-color: var(--bone);
      color: var(--ink);
    }

    .font-display {
      font-family: 'Noto Serif Thai', serif;
    }
  </style>
</head>

<body class="flex min-h-screen antialiased">

  <div id="sidebar-container" class="flex min-h-screen"></div>
  <main class="flex-1 p-6 md:p-10 max-w-6xl mx-auto">

    <header
      class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 pb-6 border-b border-[var(--ink)]/10">
      <div>
        <h1 class="font-display text-2xl font-semibold text-[var(--ink)]">ระบบจัดการรายการจอง (คนรับคิว)</h1>
        <p class="text-sm text-[var(--ink-soft)] mt-1">ตรวจสอบและกดอนุมัติหรือยกเลิกคิวของลูกค้าได้ที่นี่</p>
      </div>
      <button onclick="fetchBookings()"
        class="px-4 py-2 bg-[var(--paper)] border border-[var(--ink)]/15 hover:border-[var(--moss)] text-[var(--ink)] text-sm font-semibold rounded-full transition flex items-center gap-2 w-fit">
        <span>รีเฟรชข้อมูล</span>
      </button>
    </header>

    <div class="bg-[var(--paper)] rounded-2xl border border-[var(--ink)]/10 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-[var(--bone)] text-xs font-semibold text-[var(--ink-soft)]"
              style="border-bottom: 1px solid rgba(23,21,18,0.1);">
              <th class="py-4 px-6">Booking ID</th>
              <th class="py-4 px-6">บริการ</th>
              <th class="py-4 px-6">Slot ID</th>
              <th class="py-4 px-6">ราคา</th>
              <th class="py-4 px-6">สถานะปัจจุบัน</th>
              <th class="py-4 px-6 text-center">จัดการคิว</th>
            </tr>
          </thead>
          <tbody id="bookingsTableBody" class="divide-y divide-[var(--ink)]/5 font-medium">
            <tr>
              <td colspan="6" class="text-center py-10 text-[var(--ink-soft)]">กำลังโหลดข้อมูล...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="components/sidebar.js"></script>
  <script>
    renderSidebar('list');

    const API_URL = 'http://localhost:3000/api';

    async function fetchBookings() {
      const tbody = document.getElementById('bookingsTableBody');
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-[var(--ink-soft)]">กำลังดึงข้อมูล...</td></tr>`;

      try {
        const res = await fetch(`${API_URL}/bookings`);
        const result = await res.json();

        if (result.status === 'success' && result.data.length > 0) {
          tbody.innerHTML = '';
          result.data.forEach(item => {
            const serviceName = item.services ? item.services.service_name : 'ไม่ระบุบริการ';
            const price = item.services ? `฿${Number(item.services.price).toLocaleString()}` : '-';

            tbody.innerHTML += `
              <tr class="hover:bg-[var(--bone)]/60 transition-colors">
                <td class="py-4 px-6 font-bold text-[var(--ink)]">#BK-${item.id}</td>
                <td class="py-4 px-6 font-semibold text-[var(--ink)]">${serviceName}</td>
                <td class="py-4 px-6">
                  <span class="px-2.5 py-1 bg-[var(--bone)] text-[var(--ink-soft)] rounded-lg text-xs font-semibold">Slot #${item.slot_id}</span>
                </td>
                <td class="py-4 px-6 font-semibold text-[var(--brass)]">${price}</td>
                <td class="py-4 px-6">${getStatusBadge(item.status)}</td>
                <td class="py-4 px-6 text-center">
                  <div class="flex items-center justify-center gap-2">
                    <button onclick="updateStatus(${item.id}, 'confirmed')" class="px-3 py-1.5 bg-[var(--moss)] hover:bg-[var(--moss-dark)] text-[var(--paper)] rounded-full text-xs font-semibold transition">
                      รับคิว
                    </button>
                    <button onclick="updateStatus(${item.id}, 'cancelled')" class="px-3 py-1.5 bg-[var(--rose)]/10 hover:bg-[var(--rose)]/20 text-[var(--rose)] border border-[var(--rose)]/30 rounded-full text-xs font-semibold transition">
                      ยกเลิก
                    </button>
                  </div>
                </td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-[var(--ink-soft)]">ยังไม่มีรายการจองคิว</td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-[var(--rose)]">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`;
      }
    }

    // ฟังก์ชันยิง API อัปเดตสถานะคิว
    async function updateStatus(bookingId, newStatus) {
      try {
        const res = await fetch(`${API_URL}/bookings/${bookingId}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        const result = await res.json();
        if (res.ok && result.status === 'success') {
          fetchBookings(); // รีโหลดตารางใหม่เพื่อแสดงสถานะล่าสุด
        } else {
          alert('ไม่สามารถเปลี่ยนสถานะได้: ' + result.message);
        }
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อกับ Server');
      }
    }

    function getStatusBadge(status) {
      if (status === 'confirmed') {
        return `<span class="px-3 py-1 bg-[var(--moss)]/10 text-[var(--moss-dark)] border border-[var(--moss)]/30 rounded-full text-xs font-semibold inline-flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-[var(--moss)]"></span>รับคิวแล้ว</span>`;
      } else if (status === 'cancelled') {
        return `<span class="px-3 py-1 bg-[var(--rose)]/10 text-[var(--rose)] border border-[var(--rose)]/30 rounded-full text-xs font-semibold inline-flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-[var(--rose)]"></span>ยกเลิกคิวแล้ว</span>`;
      }
      return `<span class="px-3 py-1 bg-[var(--brass)]/10 text-[var(--brass)] border border-[var(--brass)]/30 rounded-full text-xs font-semibold inline-flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-[var(--brass)] animate-pulse"></span>รอดำเนินการ</span>`;
    }

    fetchBookings();
  </script>
</body>

</html>
