<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - จัดการคิวบริการ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif;
    }
  </style>
</head>

<body class="bg-slate-50 flex min-h-screen antialiased text-slate-800">

  <!-- Sidebar Container -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <main class="flex-1 p-6 md:p-10 max-w-7xl mx-auto">

    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 pb-6 border-b border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">⚙️ Admin Dashboard</h1>
        <p class="text-sm text-slate-500 mt-1">ระบบจัดการรายการจอง อนุมัติคิว และสรุปภาพรวมบริการ</p>
      </div>
      <button onclick="fetchAdminData()"
        class="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-semibold rounded-xl shadow-sm transition flex items-center gap-2 w-fit">
        <span>🔄 รีเฟรชข้อมูล</span>
      </button>
    </header>

    <!-- Stat Cards Overview -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-8">
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">คิวทั้งหมด</div>
        <div class="text-3xl font-extrabold text-slate-900 mt-2" id="statTotal">-</div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
        <div class="text-xs font-semibold text-amber-500 uppercase tracking-wider">รอดำเนินการ</div>
        <div class="text-3xl font-extrabold text-amber-600 mt-2" id="statPending">-</div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
        <div class="text-xs font-semibold text-emerald-500 uppercase tracking-wider">อนุมัติแล้ว</div>
        <div class="text-3xl font-extrabold text-emerald-600 mt-2" id="statConfirmed">-</div>
      </div>
    </div>

    <!-- Slots Management Section -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 mb-8">
      <h3 class="font-bold text-slate-800 text-base mb-4">⏰ จัดการรอบเวลาบริการ (Slots)</h3>

      <!-- ฟอร์มสร้าง Slot -->
      <form id="addSlotForm" onsubmit="createSlot(event)"
        class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-6 pb-6 border-b border-slate-100">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">เวลาเริ่ม</label>
          <input type="datetime-local" id="startTime" required
            class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">เวลาสิ้นสุด</label>
          <input type="datetime-local" id="endTime" required
            class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">จำนวนที่รับได้ (คน)</label>
          <input type="number" id="capacity" value="5" min="1" required
            class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="flex items-end">
          <button type="submit"
            class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl shadow-sm transition">
            + เพิ่ม Slot
          </button>
        </div>
      </form>

      <!-- รายการ Slots ที่เปิดอยู่ -->
      <div id="slotsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
        <p class="text-slate-400 text-sm">กำลังโหลดรอบเวลา...</p>
      </div>
    </div>

    <!-- Table Section -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
      <div class="p-5 border-b border-slate-100 flex items-center justify-between">
        <h3 class="font-bold text-slate-800 text-base">รายการจองคิวล่าสุด</h3>
        <span class="text-xs text-slate-400">อัปเดตแบบ Real-time</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr
              class="bg-slate-50/80 border-b border-slate-200 text-xs font-semibold uppercase tracking-wider text-slate-500">
              <th class="py-4 px-6">ID</th>
              <th class="py-4 px-6">บริการ</th>
              <th class="py-4 px-6">Slot ID</th>
              <th class="py-4 px-6">ราคา</th>
              <th class="py-4 px-6">สถานะ</th>
              <th class="py-4 px-6 text-center">การจัดการ</th>
            </tr>
          </thead>
          <tbody id="adminTableBody" class="divide-y divide-slate-100 font-medium">
            <tr>
              <td colspan="6" class="text-center py-10 text-slate-400">กำลังโหลดข้อมูล...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="components/sidebar.js"></script>
  <script>
    // ตรวจสอบ Token ก่อนแสดงเนื้อหา
    if (!localStorage.getItem('adminToken')) {
      window.location.href = '/login.html';
    }

    renderSidebar('list');

    const API_URL = 'http://localhost:3000/api';

    async function fetchAdminData() {
      const tbody = document.getElementById('adminTableBody');
      try {
        const res = await fetch(`${API_URL}/bookings`);
        const result = await res.json();

        if (result.status === 'success') {
          const bookings = result.data;

          // สรุป Stat Cards
          document.getElementById('statTotal').textContent = bookings.length;
          document.getElementById('statPending').textContent = bookings.filter(b => b.status === 'pending').length;
          document.getElementById('statConfirmed').textContent = bookings.filter(b => b.status === 'confirmed').length;

          if (bookings.length > 0) {
            tbody.innerHTML = '';
            bookings.forEach(item => {
              const serviceName = item.services ? item.services.service_name : 'ไม่ระบุบริการ';
              const price = item.services ? `฿${Number(item.services.price).toLocaleString()}` : '-';

              tbody.innerHTML += `
                <tr class="hover:bg-slate-50/80 transition-colors">
                  <td class="py-4 px-6 font-bold text-slate-900">#BK-${item.id}</td>
                  <td class="py-4 px-6 font-semibold text-slate-800">${serviceName}</td>
                  <td class="py-4 px-6">
                    <span class="px-2.5 py-1 bg-slate-100 text-slate-700 rounded-lg text-xs font-semibold">Slot #${item.slot_id}</span>
                  </td>
                  <td class="py-4 px-6 font-semibold text-slate-900">${price}</td>
                  <td class="py-4 px-6">${getStatusBadge(item.status)}</td>
                  <td class="py-4 px-6 text-center">
                    <div class="flex items-center justify-center gap-2">
                      <button onclick="updateStatus(${item.id}, 'confirmed')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold shadow-sm transition">
                        ✓ รับคิว
                      </button>
                      <button onclick="updateStatus(${item.id}, 'cancelled')" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded-xl text-xs font-semibold transition">
                        ✕ ยกเลิก
                      </button>
                    </div>
                  </td>
                </tr>
              `;
            });
          } else {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-slate-400">ยังไม่มีรายการจองคิว</td></tr>`;
          }
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-rose-500">ไม่สามารถดึงข้อมูลได้</td></tr>`;
      }
    }

    async function updateStatus(id, newStatus) {
      try {
        const res = await fetch(`${API_URL}/bookings/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        const result = await res.json();
        if (res.ok && result.status === 'success') {
          fetchAdminData();
        } else {
          alert('ไม่สามารถอัปเดตได้: ' + result.message);
        }
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อกับ Server');
      }
    }

    function getStatusBadge(status) {
      if (status === 'confirmed') {
        return `<span class="px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-xs font-semibold inline-flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>อนุมัติแล้ว</span>`;
      } else if (status === 'cancelled') {
        return `<span class="px-3 py-1 bg-rose-50 text-rose-700 border border-rose-200 rounded-full text-xs font-semibold inline-flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>ยกเลิกแล้ว</span>`;
      }
      return `<span class="px-3 py-1 bg-amber-50 text-amber-700 border border-amber-200 rounded-full text-xs font-semibold inline-flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>รอดำเนินการ</span>`;
    }

    fetchAdminData();

    // ดึงรายการ Slots ทั้งหมด
    async function fetchSlots() {
      const container = document.getElementById('slotsContainer');
      try {
        const res = await fetch(`${API_URL}/slots`);
        const result = await res.json();

        if (result.success && result.data.length > 0) {
          container.innerHTML = '';
          result.data.forEach(slot => {
            const start = new Date(slot.start_time).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });
            const end = new Date(slot.end_time).toLocaleTimeString('th-TH', { timeStyle: 'short' });

            container.innerHTML += `
          <div class="p-3 border border-slate-200 rounded-xl flex items-center justify-between bg-slate-50/50">
            <div>
              <p class="text-xs font-bold text-slate-800">${start} - ${end}</p>
              <p class="text-xs text-slate-500">ความจุ: ${slot.capacity} คิว</p>
            </div>
            <button onclick="deleteSlot('${slot.id}')" class="text-xs px-2.5 py-1 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg font-semibold transition">
              ลบ
            </button>
          </div>
        `;
          });
        } else {
          container.innerHTML = `<p class="text-slate-400 text-sm col-span-full">ยังไม่มีการเปิดรอบเวลา</p>`;
        }
      } catch (err) {
        container.innerHTML = `<p class="text-rose-500 text-sm col-span-full">ไม่สามารถโหลด Slots ได้</p>`;
      }
    }

    // สร้าง Slot ใหม่
    async function createSlot(e) {
      e.preventDefault();
      const start_time = document.getElementById('startTime').value;
      const end_time = document.getElementById('endTime').value;
      const capacity = document.getElementById('capacity').value;

      try {
        const res = await fetch(`${API_URL}/slots`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ start_time, end_time, capacity: Number(capacity) })
        });
        const result = await res.json();

        if (result.success) {
          document.getElementById('addSlotForm').reset();
          fetchSlots();
        } else {
          alert('สร้าง Slot ไม่สำเร็จ: ' + result.message);
        }
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
      }
    }

    // ลบ Slot
    async function deleteSlot(id) {
      if (!confirm('ยืนยันลบช่วงเวลานี้?')) return;
      try {
        const res = await fetch(`${API_URL}/slots/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) {
          fetchSlots();
        } else {
          alert('ลบไม่สำเร็จ: ' + result.message);
        }
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการลบ');
      }
    }

    // เรียกฟังก์ชันดึง Slots เพิ่มเติมเมื่อโหลดหน้า
    fetchSlots();

  </script>
</body>

</html>
