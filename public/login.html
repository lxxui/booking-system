<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - เข้าสู่ระบบจัดการ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-md bg-white rounded-3xl p-8 shadow-2xl border border-slate-800">
        <div class="text-center mb-8">
            <div
                class="w-12 h-12 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl font-bold shadow-lg shadow-blue-500/30">
                ⚡
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Admin Login</h1>
            <p class="text-slate-500 text-xs mt-1">กรอกข้อมูลเพื่อเข้าสู่ระบบจัดการหลังบ้าน</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Username</label>
                <input type="text" id="username" required placeholder="admin"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10 outline-none transition font-medium">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Password</label>
                <input type="password" id="password" required placeholder="••••••••"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10 outline-none transition font-medium">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl shadow-lg shadow-blue-500/25 transition">
                เข้าสู่ระบบ
            </button>
        </form>

        <div id="alertBox" class="hidden mt-4 p-3 rounded-xl text-xs font-medium text-center"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // เก็บข้อความเดิมบนปุ่มไว้
            const originalBtnContent = submitBtn.innerHTML;

            // 1. เริ่มแสดง Loading บนปุ่ม และล็อกปุ่มไม่ให้กดซ้ำ
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
        <span class="inline-flex items-center justify-center gap-2">
          <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>กำลังเข้าสู่ระบบ...</span>
        </span>
      `;
            alertBox.classList.add('hidden'); // ซ่อน Error เดิมถ้ามี

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await res.json();

                if (res.ok && result.success) {
                    localStorage.setItem('adminToken', result.token);

                    // 2. ปรับข้อความบนปุ่มเป็นกำลังนำไปหน้า Admin
                    submitBtn.innerHTML = `
            <span class="inline-flex items-center justify-center gap-2">
              <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>กำลังนำคุณไปหน้า Admin...</span>
            </span>
          `;

                    // นำทางไปหน้า /admin
                    setTimeout(() => {
                        //window.location.href = '/admin';
                        window.location.href = '/admin-dashboard';
                    }, 800);
                } else {
                    // คืนค่าปุ่มหากล็อกอินไม่สำเร็จ + แสดงข้อความเตือน
                    resetSubmitBtn(submitBtn, originalBtnContent);
                    showErrorMessage(alertBox, result.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                }
            } catch (err) {
                resetSubmitBtn(submitBtn, originalBtnContent);
                showErrorMessage(alertBox, 'ไม่สามารถเชื่อมต่อกับ Server ได้');
            }
        }

        // Helper: คืนค่าปุ่มเดิม
        function resetSubmitBtn(btn, content) {
            btn.disabled = false;
            btn.innerHTML = content;
        }

        // Helper: แสดงกล่อง Error
        function showErrorMessage(box, message) {
            box.className = 'mt-4 p-3 rounded-xl text-xs font-medium text-center bg-rose-50 text-rose-700 border border-rose-200';
            box.textContent = message;
            box.classList.remove('hidden');
        }
    </script>

</body>

</html>
