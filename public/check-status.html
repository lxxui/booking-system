<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสอบสถานะการจอง</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #171512;
      --ink-soft: #57534A;
      --bone: #EFE9DD;
      --paper: #FBF8F2;
      --moss: #4B5D46;
      --moss-dark: #3B4A38;
      --brass: #B9915B;
      --rose: #C97B6C;
    }

    body {
      font-family: 'IBM Plex Sans Thai', sans-serif;
      background-color: var(--bone);
      color: var(--ink);
    }

    .font-display {
      font-family: 'Noto Serif Thai', serif;
    }

    .stub-line {
      position: relative;
      border-top: 2px dashed rgba(23, 21, 18, 0.15);
    }

    .stub-line::before,
    .stub-line::after {
      content: "";
      position: absolute;
      top: -9px;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: var(--bone);
    }

    .stub-line::before {
      left: -9px;
    }

    .stub-line::after {
      right: -9px;
    }

    .ticket-notch-left,
    .ticket-notch-right {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--bone);
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
    }

    .ticket-notch-left {
      left: -11px;
    }

    .ticket-notch-right {
      right: -11px;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="relative max-w-md w-full bg-[var(--paper)] rounded-2xl shadow-xl p-6">
    <span class="ticket-notch-left"></span>
    <span class="ticket-notch-right"></span>

    <h1 class="font-display text-xl font-semibold text-[var(--ink)] text-center mb-1">ตรวจสอบสถานะการจอง</h1>
    <p class="text-xs text-[var(--ink-soft)] text-center mb-6">กรอกหมายเลขการจอง หรือ เบอร์โทรศัพท์ที่ใช้จองคิว</p>

    <!-- ช่องค้นหา -->
    <div class="flex gap-2 mb-6">
      <input type="text" id="searchInput" placeholder="ระบุเบอร์โทรศัพท์" maxlength="10"
        class="w-full px-4 py-2.5 border border-[var(--ink)]/15 bg-white rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[var(--moss)]/30 focus:border-[var(--moss)]">
      <button onclick="checkStatus()"
        class="px-5 py-2.5 bg-[var(--moss)] hover:bg-[var(--moss-dark)] text-[var(--paper)] rounded-full text-sm font-semibold transition shrink-0">
        ค้นหา
      </button>
    </div>

    <!-- ผลการค้นหา -->
    <div id="resultContainer" class="space-y-3"></div>
  </div>

  <!-- นำเข้า html2canvas ในแท็ก <head> ของไฟล์นี้ด้วยนะครับ -->
  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script> -->

  <script>
    async function checkStatus() {
      const query = document.getElementById('searchInput').value.trim();
      const container = document.getElementById('resultContainer');

      if (!query) return alert('กรุณากรอกข้อมูลค้นหา');

      container.innerHTML = `<p class="text-center text-sm text-[var(--ink-soft)] py-4">กำลังค้นหา...</p>`;

      try {
        const res = await fetch(`/api/bookings/search?query=${query}`);
        const result = await res.json();

        if (result.status === 'success' && result.data.length > 0) {
          container.innerHTML = '';
          result.data.forEach(item => {
            const isConfirmed = item.status === 'confirmed';
            const isCancelled = item.status === 'cancelled';
            const serviceName = item.services?.service_name || 'ไม่ระบุบริการ';
            const customerName = item.customer_name || item.name || 'ไม่ระบุชื่อ';
            const bookingDate = item.booking_date || '-';
            const bookingTime = item.booking_time || '-';

            container.innerHTML += `
              <div class="space-y-3">
                <!-- การ์ดที่จะบันทึกเป็นรูปภาพ -->
                <div id="ticket-${item.id}" class="p-5 border border-[var(--ink)]/10 rounded-2xl bg-white space-y-3 shadow-sm">
                  <div class="flex justify-between items-center stub-line pb-2.5" style="border-top:none">
                    <span class="font-display font-bold text-[var(--ink)] text-sm">#BK-${item.id}</span>
                    ${getStatusBadge(item.status)}
                  </div>
                  
                  <div class="space-y-1.5 text-xs text-[var(--ink-soft)]">
                    <p><span class="font-semibold text-[var(--ink)]">ชื่อผู้จอง:</span> ${customerName}</p>
                    <p><span class="font-semibold text-[var(--ink)]">บริการ:</span> ${serviceName}</p>
                    <p><span class="font-semibold text-[var(--ink)]">วันที่ / เวลา:</span> ${bookingDate} | ${bookingTime}</p>
                  </div>

                  <!-- แสดงเหตุผลถ้าถูกยกเลิก -->
                  ${isCancelled ? `
                    <div class="mt-2 p-2.5 bg-[var(--rose)]/10 border border-[var(--rose)]/25 rounded-lg text-xs text-[var(--rose)]">
                      <span class="font-semibold">เหตุผลการยกเลิก:</span> ${item.cancel_reason || 'ไม่ได้ระบุเหตุผล'}
                    </div>
                  ` : ''}

                  <!-- ข้อความท้ายตั๋วที่จะติดไปในรูปภาพ -->
                  ${isConfirmed ? `
                    <div class="pt-2 border-t border-dashed border-stone-200 text-center text-[10px] text-stone-400">
                      กรุณายื่นภาพนี้ให้เจ้าหน้าที่เมื่อมาถึงร้าน
                    </div>
                  ` : ''}
                </div>

                <!-- ปุ่มบันทึกภาพ (แสดงเฉพาะเมื่ออนุมัติแล้ว) -->
                ${isConfirmed ? `
                  <button onclick="downloadTicket('ticket-${item.id}', '${item.id}')" class="w-full py-2.5 px-4 bg-[var(--moss-dark)] text-white text-xs font-semibold rounded-xl hover:opacity-90 transition-all shadow-sm flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    บันทึกภาพคิวเข้าเครื่อง
                  </button>
                ` : ''}
              </div>
            `;
          });
        } else {
          container.innerHTML = `<p class="text-center text-sm text-[var(--ink-soft)] py-4">ไม่พบข้อมูลการจอง</p>`;
        }
      } catch (err) {
        container.innerHTML = `<p class="text-center text-sm text-[var(--rose)] py-4">เกิดข้อผิดพลาดในการเชื่อมต่อ</p>`;
      }
    }

    // ฟังก์ชันสำหรับเซฟภาพคิว
    function downloadTicket(elementId, bookingId) {
      const ticketElement = document.getElementById(elementId);
      if (!ticketElement) return;

      if (typeof html2canvas === 'undefined') {
        alert('ระบบบันทึกภาพยังไม่พร้อมใช้งาน กรุณาตรวจสอบว่าได้ใส่ CDN html2canvas ในไฟล์แล้ว');
        return;
      }

      html2canvas(ticketElement, {
        scale: 2,
        backgroundColor: '#ffffff'
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `booking-ticket-BK-${bookingId}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    function getStatusBadge(status) {
      if (status === 'confirmed') {
        return `<span class="px-2.5 py-1 bg-[var(--moss)]/10 text-[var(--moss-dark)] border border-[var(--moss)]/30 rounded-full text-xs font-semibold">อนุมัติแล้ว</span>`;
      } else if (status === 'cancelled') {
        return `<span class="px-2.5 py-1 bg-[var(--rose)]/10 text-[var(--rose)] border border-[var(--rose)]/30 rounded-full text-xs font-semibold">ยกเลิกแล้ว</span>`;
      }
      return `<span class="px-2.5 py-1 bg-[var(--brass)]/10 text-[var(--brass)] border border-[var(--brass)]/30 rounded-full text-xs font-semibold">รอดำเนินการ</span>`;
    }

    document.getElementById('searchInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        checkStatus();
      }
    });
  </script>
</body>

</html>
